---

# 📦 Dependências básicas
- name: Install dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true
  when: not ansible_check_mode


# 📁 Criar diretório de keyrings
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: not ansible_check_mode


# 🔐 Adicionar chave GPG do Kubernetes
- name: Add Kubernetes GPG key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key \
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
  when: not ansible_check_mode


# 📦 Adicionar repositório Kubernetes (DINÂMICO)
- name: Add Kubernetes repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
  when: not ansible_check_mode


# 🔄 Atualizar cache
- name: Update apt cache
  apt:
    update_cache: true
  when: not ansible_check_mode


# ☸️ Instalar Kubernetes tools
- name: Install Kubernetes packages
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
  when: not ansible_check_mode


# 🔒 Travar versões (evita updates quebrando cluster)
- name: Hold Kubernetes versions
  command: apt-mark hold kubelet kubeadm kubectl
  when: not ansible_check_mode


# 🚫 Desativar swap (obrigatório para Kubernetes)
- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0


- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'


# ⚙️ Kernel modules necessários
- name: Load kernel modules config
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter


- name: Load overlay kernel module now
  command: modprobe overlay


- name: Load br_netfilter kernel module now
  command: modprobe br_netfilter


# 🌐 Sysctl para rede Kubernetes
- name: Set sysctl config
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1


- name: Apply sysctl settings
  command: sysctl --system

